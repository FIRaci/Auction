services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: royal-auction-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=royal_auction_super_secret_jwt_key_2026
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173,http://localhost:80
    volumes:
      - backend-data:/app/prisma
    networks:
      - auction-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: royal-auction-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    networks:
      - auction-network

volumes:
  backend-data:

networks:
  auction-network:
    driver: bridge

